name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.artifact-suffix }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact-suffix: windows-x64
          - platform: macos-latest
            artifact-suffix: macos-arm64
          - platform: ubuntu-22.04
            artifact-suffix: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            build-essential \
            libssl-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            file

      - name: Install dependencies
        run: npm ci

      - name: Check versions
        run: npm run version:check

      - name: Typecheck app
        run: npm run typecheck

      - name: Typecheck tools
        run: npm run typecheck:tools

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: easy-console-coverage-${{ matrix.artifact-suffix }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Placeholder sidecar binaries
        run: node tools/easy-console/ensure-sidecar-placeholders.mjs

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust unit and storage interoperability tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build desktop inputs
        run: npm run build:desktop

      - name: Test packaged CLI backup round-trip
        shell: bash
        run: |
          cli="build/sidecars/easy-console-cli"
          if [[ "$RUNNER_OS" == "Windows" ]]; then cli="$cli.exe"; fi
          node --import tsx tools/acceptance/cli-backup-smoke.ts "$cli"

      - name: Check Tauri shell
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: SSH integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --test ssh_integration --features ssh-test-internals

      - name: Upload sidecar artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: easy-console-sidecars-${{ matrix.artifact-suffix }}
          path: build/sidecars/*
