name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    name: Release ${{ matrix.artifact-suffix }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.release_metadata.outputs.tag }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            artifact-suffix: windows-x64
            args: ""
            rust-targets: ""
          - platform: ubuntu-22.04
            artifact-suffix: linux-x64
            args: ""
            rust-targets: ""
          - platform: macos-latest
            artifact-suffix: macos-arm64
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
          - platform: macos-15-intel
            artifact-suffix: macos-x64
            args: "--target x86_64-apple-darwin"
            rust-targets: "x86_64-apple-darwin"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Add Rust target
        if: matrix.rust-targets != ''
        run: rustup target add ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            build-essential \
            libssl-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Install dependencies
        run: npm ci

      - name: Check versions
        run: npm run version:check

      - name: Prepare release notes and publication mode
        id: release_metadata
        run: node --import tsx tools/easy-console/release-metadata.ts

      - name: Typecheck app
        run: npm run typecheck

      - name: Typecheck tools
        run: npm run typecheck:tools

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Placeholder sidecar binaries
        run: node tools/easy-console/ensure-sidecar-placeholders.mjs

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release_metadata.outputs.tag }}
          releaseName: ${{ steps.release_metadata.outputs.name }}
          releaseBody: ${{ steps.release_metadata.outputs.body }}
          releaseDraft: ${{ steps.release_metadata.outputs.draft }}
          prerelease: ${{ steps.release_metadata.outputs.prerelease }}
          releaseCommitish: ${{ github.sha }}
          updaterJsonPreferNsis: true
          retryAttempts: 3
          args: ${{ matrix.args }}

      - name: Upload sidecar artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: easy-console-sidecars-${{ matrix.artifact-suffix }}
          path: build/sidecars/*
          retention-days: 30

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: easy-console-desktop-${{ matrix.artifact-suffix }}
          path: |
            src-tauri/target/**/release/EasyConsole*
            src-tauri/target/**/release/bundle/**
            build/sidecars/*
          retention-days: 30

  release-android:
    name: Release Android (${{ matrix.target }})
    needs: release-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            rust-target: aarch64-linux-android
            cc-env: aarch64_linux_android
            cc-suffix: aarch64-linux-android24
            linker-env: CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
          - target: x86_64
            rust-target: x86_64-linux-android
            cc-env: x86_64_linux_android
            cc-suffix: x86_64-linux-android24
            linker-env: CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'
          cache-targets: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install NDK and set environment
        run: |
          # Remove pre-installed NDKs so Tauri CLI only finds NDK 27
          ls "$ANDROID_HOME/ndk/" 2>/dev/null && rm -rf "$ANDROID_HOME/ndk/"* || true
          sdkmanager "ndk;27.0.12077973"
          NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          echo "NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: npm ci

      - name: Verify gen/android exists
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "::error::src-tauri/gen/android/ not found. Run 'npm run tauri:android:init' locally and commit the result."
            exit 1
          fi

      - name: Setup Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Android release signing secrets are required; refusing to publish an APK that cannot update an installed app."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export CC_${{ matrix.cc-env }}="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc-suffix }}-clang"
          export AR_${{ matrix.cc-env }}="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export ${{ matrix.linker-env }}="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc-suffix }}-clang"
          npx tauri android build --target ${{ matrix.target }} --apk --verbose

      - name: Verify signed Android APK
        run: |
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" ! -name "*-unsigned.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No signed APK found for ${{ matrix.target }}"
            exit 1
          fi
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose --print-certs "$APK_PATH"
          echo "ANDROID_RELEASE_APK=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-desktop.outputs.release_tag }}
        run: |
          TAG="$RELEASE_TAG"
          cp "$ANDROID_RELEASE_APK" "EasyConsole-${TAG}-android-${{ matrix.target }}.apk"
          gh release upload "$TAG" "EasyConsole-${TAG}-android-${{ matrix.target }}.apk" --clobber

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: easy-console-android-${{ matrix.target }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
